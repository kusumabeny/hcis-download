services:
  hcis-download:
    build:
      context: .
      args:
        VITE_ADMIN_PASSWORD: ${VITE_ADMIN_PASSWORD:-admin123}
    image: ${IMAGE:-ghcr.io/kusumabeny/hcis-download}:latest
    container_name: hcis-download
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist uploaded APK/IPA files across container restarts
      - hcis_downloads:/app/dist/downloads
      # Persist release configuration across image updates
      - hcis_releases:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  hcis_downloads:
    driver: local
  hcis_releases:
    driver: local
